<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Make 10 Puzzle</title>
  </head>
  <body>
    <div id="app">
      <div class="header-container">
        <h1>今日のMake 10 パズル</h1>   
        
        <div class="header-actions">
          <button id="btn-setting" class="icon-btn" title="設定">⚙</button>
        </div>
      </div>


      <div class="calculator">
        <div class="display" id="formula-display">
          </div>

        <div class="keyboard">
          <div class="numbers-row" id="numbers-container">
            <span class="loading">数字を取得中...</span>
          </div>

          <div class="operators-row">
            <button class="btn op-btn">+</button>
            <button class="btn op-btn">-</button>
            <button class="btn op-btn">*</button>
            <button class="btn op-btn">/</button>
            <button class="btn op-btn">(</button>
            <button class="btn op-btn">)</button>
          </div>

          <div class="controls-row">
            <button class="btn action-btn" id="btn-delete">1つ消す</button>
            <button class="btn action-btn" id="btn-reset">やり直す</button>
          </div>
          
          <button class="btn submit-btn" id="btn-submit">提出する (10か判定！)</button>
        </div>
      </div>

      <dialog id="setting-dialog">
        <h2>設定</h2>

        <div class="setting-item">
          <span>ダークモード</span>
          <div class="toggle-container">
            <label class="toggle-switch">
              <input type="checkbox" id="dark-mode-toggle">
              <span class="slider"></span>
            </label>
            <span id="dark-mode-label" style="display: inline-block; width: 40px; text-align: left;">OFF</span>
          </div>
        </div>
        
        <div class="setting-item">
          <span>遊び方・ルール</span>
          <button id="btn-rule" class="btn" style="padding: 6px 13px; font-size: 14px; max-width: 100px;">見る</button>
        </div>
        
        <div class="setting-item">
          <span>ホームに戻る</span>
          <button id="btn-go-home" class="btn action-btn" style="padding: 6px 13px; font-size: 14px; max-width: 100px;">戻る</button>
        </div>

        <div class="dialog-actions">
          <button id="btn-close-setting" class="btn" style="width: 100px;">閉じる</button>
        </div>
      </dialog>
    </div>
    <dialog id="rule-dialog">
        <h2>ルールの説明</h2>
        <ul>
          <li>用意された数字を、<strong>すべて1回ずつ</strong>使います。</li>
          <li>四則演算（＋, －, ×, ÷ ）とカッコを組み合わせて、計算結果が<strong>ピッタリ「10」</strong>になる数式を作ってください。</li>
        </ul>
        <div class="dialog-actions">
          <button id="btn-close-rule" class="btn">閉じる</button>
        </div>
    </dialog>
    <dialog id="already-cleared-dialog">
      <h2 style="color: var(--text-color); text-align: center;">プレイ済み</h2>
      <p style="line-height: 1.6;">
        今日のデイリーチャレンジはすでにクリア済みです！<br>
        明日また挑戦してね。
      </p>
      <div class="dialog-actions">
        <button id="btn-return-home-early" class="btn action-btn" style="padding: 12px;">ホームに戻る</button>
      </div>
    </dialog>

    <dialog id="clear-result-dialog">
      <h2 style="color: #4caf50;">🎉 クリア！ 🎉</h2>
      <p>おめでとうございます！全問正解しました。</p>

      <p style="font-size: 1.2rem; font-weight: bold; text-align: center; margin: 20px 0;">
        タイム: <span id="clear-time-display"></span>
      </p>


      <div id="ranking-registration-area" style="text-align: center; margin-bottom: 20px;">
        <input type="text" id="player-name-input" placeholder="名前を入力" maxlength="10" style="padding: 8px; width: 60%; border-radius: 4px; border: 1px solid var(--border-color); background-color: var(--bg-color); color: var(--text-color);">
        <button id="btn-register-ranking" class="btn" style="padding: 8px 16px; margin-left: 8px; font-size: 14px;">登録</button>
      </div>

      <div id="ranking-display-area" style="background-color: var(--placeholder-bg); padding: 15px; border-radius: 8px; margin-bottom: 20px;">
        <h3 style="text-align: center; margin-top: 0; color: var(--text-color);">🏆 トップ10ランキング 🏆</h3>
        <ul id="ranking-list" style="list-style: none; padding: 0; margin: 0; color: var(--text-color); font-weight: bold; line-height: 1.8;">
          </ul>
      </div>

      <div class="dialog-actions">
        <button id="btn-return-home-clear" class="btn submit-btn">ホームに戻る</button>
      </div>
    </dialog>
    <div id="toast" class="toast"></div>
    
    <script type="module" src="./daily.ts"></script>
  </body>
</html>
