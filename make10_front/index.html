<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Make 10 Puzzle - Home</title>
  </head>
  <body>
    <div id="app">
      <div class="header-container" style="justify-content: flex-end;">
        <button id="btn-show-ranking" class="icon-btn" title="ランキング">🏆</button>
        <button id="btn-setting-home" class="icon-btn" title="設定">⚙</button>
      </div>

      <div class="home-menu" style="text-align: center; margin-top: 40px; margin-bottom: 40px;">
        <h1 style="font-size: 2.5rem; margin-bottom: 40px; color: #1976d2; letter-spacing: 2px;">Make 10 Puzzle</h1>
        
        <div style="display: flex; flex-direction: column; gap: 20px; align-items: center;">
          <button id="btn-go-daily" class="btn submit-btn" style="width: 80%; max-width: 300px; padding: 20px; font-size: 1.2rem;">
            デイリータイムアタック
          </button>
          
          <button id="btn-go-practice" class="btn op-btn" style="width: 80%; max-width: 300px; padding: 20px; font-size: 1.2rem; color: #1976d2; border: 2px solid #1976d2;">
            エンドレス (練習)
          </button>
        </div>
      </div>
    </div>

    <dialog id="setting-dialog">
        <h2>設定</h2>

        <div class="setting-item">
          <span>ダークモード</span>
          <div class="toggle-container">
            <label class="toggle-switch">
              <input type="checkbox" id="dark-mode-toggle">
              <span class="slider"></span>
            </label>
            <span id="dark-mode-label" style="display: inline-block; width: 40px; text-align: left;">OFF</span>
          </div>
        </div>

        <div class="setting-item">
          <span>遊び方・ルール</span>
          <button id="btn-rule" class="btn" style="padding: 6px 13px; font-size: 14px; max-width: 100px;">見る</button>
        </div>

        <div class="dialog-actions">
          <button id="btn-close-settings" class="btn" style="width: 100px;">閉じる</button>
        </div>
      </dialog>

    <dialog id="rule-dialog">
        <h2>ルールの説明</h2>
        <ul>
          <li>用意された数字を、<strong>すべて1回ずつ</strong>使います。</li>
          <li>四則演算（＋, －, ×, ÷ ）とカッコを組み合わせて、計算結果が<strong>ピッタリ「10」</strong>になる数式を作ってください。</li>
        </ul>

        <div class="dialog-actions">
          <button id="btn-close-rule" class="btn">閉じる</button>
        </div>
      </dialog>

    <dialog id="ranking-dialog">
      <h2 style="text-align: center; color: var(--text-color);">本日のランキング</h2>
      
      <div style="background-color: var(--placeholder-bg); padding: 15px; border-radius: 8px; margin-bottom: 20px;">
        <ul id="home-ranking-list" style="list-style: none; padding: 0; margin: 0; color: var(--text-color); font-weight: bold; line-height: 1.8;">
          </ul>
      </div>

      <div class="dialog-actions">
        <button id="btn-close-ranking" class="btn">閉じる</button>
      </div>
    </dialog>
    
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
