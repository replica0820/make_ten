<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Make 10 Puzzle</title>
  </head>
  <body>
    <div id="app">
      <div class="header-container">
        <h1>今日のMake 10 パズル</h1>   
        <button id="btn-rule" class="info-btn" title="ルールを見る">i</button>
      </div>
      <div style="text-align: center; margin-bottom: 20px;">
        <a href="/practice/" class="btn" style="background-color: #2196f3; text-decoration: none; display: inline-block;">プラクティスモードへ ➔</a>
      </div>

      <div class="calculator">
        <div class="display" id="formula-display">
          </div>

        <div class="keyboard">
          <div class="numbers-row" id="numbers-container">
            <span class="loading">数字を取得中...</span>
          </div>

          <div class="operators-row">
            <button class="btn op-btn">+</button>
            <button class="btn op-btn">-</button>
            <button class="btn op-btn">*</button>
            <button class="btn op-btn">/</button>
            <button class="btn op-btn">(</button>
            <button class="btn op-btn">)</button>
          </div>

          <div class="controls-row">
            <button class="btn action-btn" id="btn-delete">1つ消す</button>
            <button class="btn action-btn" id="btn-reset">やり直す</button>
          </div>
          
          <button class="btn submit-btn" id="btn-submit">提出する (10か判定！)</button>
        </div>
      </div>
      <dialog id="rule-dialog">
        <h2>ルールの説明</h2>
        <ul>
          <li>用意された4つの数字を、<strong>すべて1回ずつ</strong>使います。</li>
          <li>四則演算（＋, －, ×, ÷ ）とカッコを組み合わせて、計算結果が<strong>ピッタリ「10」</strong>になる数式を作ってください。</li>
        </ul>

        <div class="dialog-actions">
          <button id="btn-close-rule" class="btn">閉じる</button>
        </div>
      </dialog>
    </div>
    <div id="toast" class="toast"></div>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
